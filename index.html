<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />

    <title>Hunafa Zaky | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div
          class="header"
          style="background-image: url('./assets/images/illustration-article.svg')"
        ></div>
        <div class="content">
          <span class="badge">Learning</span>
          <p class="date">Published 21 Dec 2023</p>
          <h1 class="title">
            <a href="#">HTML &amp; CSS foundations</a>
          </h1>
          <p class="caption">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="footer">
          <img
            src="./assets/images/image-avatar.webp"
            alt=""
            width="32"
            height="32"
          />
          <p class="user-name">Greg Hooper</p>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend Mentor</a>.
      Coded by <a href="https://hunafazaky.github.io/" target="_blank" rel="noreferrer">Hunafa Zaky</a>.
    </footer>
  </body>
</html>
